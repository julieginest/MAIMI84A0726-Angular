<a [routerLink]="isA() ? ['/', comm().id, 'e'] : ['/', comm().slug]" >
<div class="comm">
    <div class="imageDiv">
        <img [src]="comm().image" alt="">
    </div>

        <h3>{{ comm().title }}</h3>
        
        <p>{{ comm().createdAt | date:'mediumDate' }}</p>
        
        @if (isA()) {
            <button (click)="onToggleClick($event)">
                @if (comm().visible) {
                    Cacher
                } @else {
                    Rendre visible
                }
            </button>
            <button (click)="onRemoveClick($event)">
                Supprimer
            </button>
        }
    </div>
</a>
